[YouTube-Custom]
enabled = false
exclusive-patches = true
build-mode = "module"
module-prop-name = "youtube-E85"
patches-source = "E85Addict/E85Addict.github.io"
included-patches = """\
    'Custom branding' 'Seekbar' 'Remove background playback restrictions' \
    'Video ads' 'Hide ads' 'Video quality' 'Theme' 'Change form factor' \
    'Return YouTube Dislike' 'Miniplayer' 'SponsorBlock' \
    """
patcher-args = """\
    -e 'Change header' -Ocustom=logos/vanced_og_header/ \
    -e 'Custom branding' -OcustomName='YouTube' -OcustomIcon=logos/vanced_og_launcher/ \
    """
github_release-dlurl = "https://github.com/E85Addict/APKs/releases/tag/com.google.android.youtube"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
